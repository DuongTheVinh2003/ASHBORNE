<text x="76" y="625" fill="#bfc7c7" class="small">Mực hành quân, giấy tro và quân cờ đồng.</text>
<text x="534" y="593" fill="#e8dcc5" class="serif" font-size="25">Bước qua cổng ấy</text>
<text x="534" y="625" fill="#bfc7c7" class="small">Hai trụ nghiêng, vết nứt và một đốm đèn.</text>
